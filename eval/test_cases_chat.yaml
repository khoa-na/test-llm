- id: T12.v1
  use_case: UC-06
  criteria:
  - TC-02
  - TC-01
  name: Sắp xếp 8 task theo ưu tiên
  type: reasoning_with_data
  language: vi
  thinking_compare: true
  turns:
  - role: user
    content: |
      giúp tôi sắp xếp 8 việc cần làm theo thứ tự ưu tiên:
      1. Ký hợp đồng đối tác Singapore (deadline mai, blocking nhiều người)
      2. Review CV ứng viên (deadline cuối tuần)
      3. Trả lời email khách hàng X (đang chờ 2 ngày)
      4. Họp 1-1 với cấp dưới (đã hoãn 1 lần)
      5. Đọc báo cáo tài chính Q2 (deadline thứ 6)
      6. Viết feedback cho team Design (low priority)
      7. Xác nhận lịch họp BGĐ (deadline trong 2h)
      8. Cập nhật LinkedIn (no deadline)

      giải thích lý do sắp xếp
  expected:
    eval_notes: 'Đưa ra danh sách sắp xếp logic: Ưu tiên cao nhất là việc gấp nhất và có tính blocking (7 và 1). Việc ít quan trọng nhất để cuối (8). Giải thích lý do hợp lý.'
- id: T06.v1
  use_case: UC-07
  criteria:
  - TC-01
  - TC-04
  - TC-02
  name: Tóm tắt forward email
  type: realistic
  language: vi
  turns:
  - role: user
    content: |
      tóm tắt cho tôi 3 ý chính:

      Kính gửi anh Khoa,

      Tôi viết để báo cáo tình hình dự án Alpha trong tháng qua.

      Về tiến độ: đã hoàn thành 70% kế hoạch, nhưng 2 module Authentication và Payment chậm hơn dự kiến 2 tuần do thay đổi yêu cầu từ khách hàng.

      Về ngân sách: đã chi 65% budget. Dự kiến vượt 8% nếu giữ hướng hiện tại. Có 2 phương án: cắt feature nice-to-have, hoặc xin duyệt thêm 10% ngân sách.

      Về nhân sự: cần tuyển thêm 1 senior backend dev cho module Payment. HR đã có 3 ứng viên.

      Mong anh duyệt và phản hồi trước thứ 6.

      Trân trọng, Minh - PM
  expected:
    must_contain:
    - 70%
    - ngân sách
    must_not_contain:
    - 50%
    - 100%
    - 20%
    eval_notes: 'Trích xuất chính xác 3 ý cốt lõi: Tiến độ 70% (chậm 2 tuần), chi ngân sách 65% (nguy cơ vượt 8%), nhân sự cần 1 senior dev. Tuyệt đối không bịa số liệu.'
