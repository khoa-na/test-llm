    - 28/5
    - ngân sách
    - Q2
    eval_notes: 'SAU RAG: nêu đúng các task gấp theo deadline (gần nhất 28/5 trước), không bịa task khác.'
- id: T02.v2
  use_case: UC-02
  criteria:
  - TC-02
  name: Task quá hạn
  type: realistic
  language: vi
  turns:
  - role: user
    content: task nào đang trễ
  expected:
    eval_notes: Phân biệt quá hạn vs sắp tới hạn
- id: T02.v2.rag
  use_case: UC-02
  criteria:
  - TC-02
  - TC-01
  name: '[RAG] Task nào đang trễ khi có data trạng thái'
  type: rag_with_data
  language: vi
  turns:
  - role: user
    content: |-
      [Dữ liệu truy xuất — hôm nay 27/05/2026]
      - Soạn hợp đồng khách C: hạn 25/5 — CHƯA XONG
      - Gửi proposal: hạn 26/5 — ĐÃ XONG
      - Cập nhật website: hạn 30/5 — đang làm

      task nào đang trễ
  expected:
    must_contain:
    - hợp đồng khách C
    - 25/5
    eval_notes: 'SAU RAG: chỉ ra đúng task quá hạn (hợp đồng khách C, hạn 25/5 chưa xong); phân biệt với task sắp tới hạn. Không kể nhầm task đã xong.'
- id: T12.v2
  use_case: UC-06
  criteria:
  - TC-02
  - TC-08
  name: Quá nhiều thông tin, model có sort tốt không
  type: realistic
  language: vi
  turns:
  - role: user
    content: tôi có 10 việc tồn đọng, giúp sắp xếp thứ tự
  expected:
    eval_notes: Phải yêu cầu cung cấp danh sách chi tiết các công việc, mức độ gấp và tầm quan trọng thay vì tự bịa việc.
- id: T12.v2.rag
  use_case: UC-06
  criteria:
  - TC-02
  - TC-01
  name: '[RAG] Sắp xếp việc tồn đọng khi có danh sách truy xuất'
  type: rag_with_data
  language: vi
  turns:
  - role: user
    content: |-
      [Dữ liệu truy xuất — 10 việc đang mở]
      1. Ký hợp đồng Singapore (hạn mai, blocking)
      2. Review CV (hạn cuối tuần)
      3. Trả lời email khách X (chờ 2 ngày)
      4. Họp 1-1 cấp dưới (đã hoãn 1 lần)
      5. Đọc báo cáo TC Q2 (hạn thứ 6)
      6. Feedback team Design (thấp)
      7. Xác nhận lịch họp BGĐ (hạn 2h)
      8. Cập nhật LinkedIn (no deadline)
      9. Lên kế hoạch tuyển dụng (hạn tuần sau)
      10. Chuẩn bị slide hội thảo (hạn 10 ngày)

      tôi có 10 việc tồn đọng, giúp sắp xếp thứ tự
  expected:
    eval_notes: 'SAU RAG: sắp xếp 10 việc theo độ gấp + blocking (7 và 1 lên đầu, 8 cuối) kèm lý do. Tương phản T12.v2 (chưa có data → phải hỏi danh sách).'
- id: HAL.v1
  use_case: UC-01
  criteria:
  - TC-01
  - TC-08
  name: Hỏi nội dung email cụ thể không có context
  type: robustness
  language: vi
  turns:
  - role: user
    content: email từ anh Tuấn sáng nay nói gì
  expected:
    must_not_contain:
    - anh Tuấn nói
    - anh Tuấn viết
    - anh Tuấn báo cáo
    - anh Tuấn thông báo
    - theo email anh Tuấn
    eval_notes: 'CRITICAL: Bot phải báo lỗi thiếu thông tin/không có quyền truy cập email. Tuyệt đối không được tự bịa nội dung email. Cấm chỉ các cụm KHẲNG ĐỊNH (anh Tuấn đã nói/viết/báo cáo); chấp nhận model bảo user paste nội dung.'
