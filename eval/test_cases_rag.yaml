    - thứ 5
    eval_notes: 'SAU RAG: tóm tắt đúng nội dung email từ data (giảm 12%, duyệt 80 triệu trước thứ 5). Không bịa chi tiết ngoài email. Tương phản HAL.v1 (chưa có data → refuse).'
