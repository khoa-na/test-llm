  use_case: UC-02
  criteria:
  - TC-02
  - TC-06
  name: Việc gì gấp tuần này
  type: realistic
  language: vi
  turns:
  - role: user
    content: việc gì gấp tuần này
  expected:
    eval_notes: 'Intent: list deadline tuần này. Không data → phải nói chưa có context.'
- id: T02.v1.rag
  use_case: UC-02
  criteria:
  - TC-02
  - TC-06
  - TC-01
  name: '[RAG] Việc gấp tuần này khi có task data'
  type: rag_with_data
  language: vi
  turns:
  - role: user
    content: |-
      [Dữ liệu truy xuất từ task list — hôm nay 27/05/2026]
