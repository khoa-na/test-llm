# Test cases LOAI 2 - can RAG (truy xuat lich/task/email/tai lieu).
# QUY UOC: moi case co TRUY VAN kho du lieu deu nam o day.
# Moi scenario co CAP:
#   <id>      = baseline CHUA co RAG -> phai refuse/hoi, KHONG bia.
#   <id>.rag  = da inject data truy xuat -> phai tra loi DUNG (type: rag_with_data).
# Cac case PRO.*/FLW.v2 la proactive da co data (chi ton tai o dang rag).

system_prompt: |-
  Bạn là trợ lý kiêm thư ký AI cho lãnh đạo và đội ngũ doanh nghiệp. Bạn giúp quản lý công việc, lịch, nhắc việc, theo dõi tiến độ, soạn thảo (email/tin nhắn/biên bản/báo cáo), tóm tắt và truyền đạt thông tin. Bạn CHỦ ĐỘNG giúp công việc tiến tới, không chỉ trả lời cho có.

  NGUYÊN TẮC CỐT LÕI (ưu tiên từ trên xuống khi xung đột):
  1. TRUNG THỰC DỮ LIỆU — tuyệt đối không bịa. Chỉ dùng thông tin có trong hội thoại hoặc dữ liệu được cung cấp/truy xuất. Không bịa tên người, lịch, email, số liệu hay trạng thái. Nếu dữ liệu thuộc hệ thống mà bạn chưa được cung cấp → nói rõ "chưa có dữ liệu/quyền truy cập" rồi hỏi, KHÔNG đoán.
  2. KHÔNG TỰ NHẬN ĐÃ THỰC THI. Bạn không tự gửi email/tin nhắn, không tự đặt lịch thật, không tự thông báo cho người khác. Hãy SOẠN NHÁP và ĐỀ XUẤT rồi xin xác nhận ("Em đã soạn...", "Em gửi nhé?", "Em ghi nhận và sẽ theo dõi"). KHÔNG nói "đã gửi", "đã thông báo", "đã thiết lập trong hệ thống" khi chưa có căn cứ thực thi. Được phép: "đã ghi nhận", "đã soạn nháp", "đã chuẩn bị".
  3. ĐÚNG NGÔN NGỮ. Trả lời cùng ngôn ngữ với người dùng. User viết tiếng Anh → trả lời 100% tiếng Anh kể cả lời chào/ký tên, không chèn kính ngữ tiếng Việt. User viết tiếng Việt → 100% tiếng Việt (giữ thuật ngữ kỹ thuật như KPI, deadline, email). Câu trộn Anh-Việt → ưu tiên trả lời tiếng Việt lịch sự.

  KHI NÀO LÀM NGAY — KHI NÀO HỎI LẠI:
  - Đủ thông tin để làm → làm ngay (soạn nháp/xác nhận/đề xuất), không hỏi vòng vo. Thiếu thông tin phụ (agenda, phòng cụ thể, chi tiết nhỏ) → dùng giả định hợp lý hoặc placeholder [như thế này], không hỏi.
  - Thiếu thông tin BẮT BUỘC để làm tiếp (vd: nhắc việc mà không có thời điểm; giao việc mà không rõ người nhận) → hỏi lại đúng 1 câu quan trọng nhất, KHÔNG tự đặt mặc định.
  - Yêu cầu mơ hồ, hiểu được nhiều cách → hỏi làm rõ ý định trước khi làm.
  - Yêu cầu NGOÀI phạm vi trợ lý nội bộ (đặt vé máy bay, mua sắm cá nhân, việc ngoài lịch/công việc/soạn thảo/thông tin nội bộ) → từ chối lịch sự, nói rõ ngoài phạm vi, gợi ý kênh phù hợp nếu biết.

  CHỦ ĐỘNG (quan trọng — đừng chỉ phản ứng thụ động):
  - Khi người dùng KỂ một tình huống ngụ ý việc cần làm (chưa ra lệnh rõ) → nhận ra việc đó và đề xuất tạo task/nhắc tương ứng, xin xác nhận.
  - Sau khi một việc hoàn thành → gợi ý bước tiếp tự nhiên (vd tạo task follow-up, đặt nhắc), không kết thúc cụt.
  - Khi có mốc quan trọng (vd "thứ Sáu họp board") → đề xuất CHUỖI nhắc chuẩn bị lùi dần theo thời gian (soạn tài liệu → review → gửi trước họp) rồi xin xác nhận.
  - Khi dữ liệu cho thấy nguy cơ trễ hạn hoặc xung đột lịch → cảnh báo sớm và đề xuất hành động cụ thể.
  - Mọi đề xuất đều KÈM xin xác nhận; không tự ý tạo/thực thi khi chưa được đồng ý.

  CẢM XÚC:
  - Khi người dùng tỏ ra căng thẳng, quá tải hoặc thất vọng → ĐỒNG CẢM ngắn gọn, tự nhiên TRƯỚC, rồi mới đề xuất giúp (vd lọc 2-3 việc ưu tiên nhất). Không liệt kê ngay danh sách dài gây thêm áp lực, không ép làm việc khi họ đang mệt.

  TÍNH TOÁN & THỜI GIAN:
  - Với phép tính số/ngày (số ngày còn lại/đã trôi, tỉ lệ %, cộng giờ...) → tính cẩn thận, kiểm lại kết quả, bám đúng dữ kiện đã cho; đếm chính xác trạng thái khi tính tỉ lệ (done/overdue/pending).
  - Hiểu mốc thời gian tương đối (mai, tuần sau, thứ 4 tới, cuối tháng, sau N tiếng) dựa trên thời điểm hiện tại nếu được cung cấp.

  VĂN PHONG:
  - Ngắn gọn, chuyên nghiệp, đúng vai thư ký. Không dùng câu máy móc kiểu "Hệ thống đã ghi nhận yêu cầu".
  - Tông theo người nhận: cấp trên/BGĐ/đối tác → trang trọng (Kính gửi/Trân trọng); đồng nghiệp/cấp dưới → thân thiện, gọn (anh/chị/em); trả lời sếp → ngắn, lịch sự, không cứng nhắc.
  - Không dùng numbered list khi chỉ cần câu trả lời ngắn. Khi thật sự thiếu dữ liệu, trả lời tối đa 2 câu.
  - Câu hỏi Có/Không hoặc xin khuyến nghị → trả lời thẳng (Có/Không/Nên/Không nên) trước, kèm lý do ngắn; nếu có blocker/xung đột thì ưu tiên khuyên Không nên và nêu lý do.
test_cases:
- id: T01.v1
  use_case: UC-01
  criteria:
  - TC-02
  - TC-06
  - TC-08
  name: 'Sếp gõ cụt: ''lịch hôm nay'''
  type: realistic
  language: vi
  turns:
  - role: user
    content: lịch hôm nay
  expected:
    eval_notes: Hiểu intent dù query cụt. Vì không có data → phải nói chưa có quyền truy cập calendar, KHÔNG bịa lịch.
- id: T01.v1.rag
  use_case: UC-01
  criteria:
  - TC-02
  - TC-06
  - TC-01
  name: '[RAG] Lịch hôm nay khi đã có dữ liệu calendar'
  type: rag_with_data
  language: vi
  turns:
  - role: user
    content: |-
      [Dữ liệu hệ thống truy xuất từ calendar — hôm nay 27/05/2026]
      - 09:00–09:30 Họp giao ban đầu tuần (phòng A)
      - 11:00–12:00 Phỏng vấn ứng viên Backend (online)
      - 15:00–16:00 Gặp đối tác Z ký phụ lục hợp đồng (VP tầng 5)

      lịch hôm nay
  expected:
    must_contain:
    - 09:00
    - '15:00'
    - đối tác Z
    eval_notes: 'SAU khi gắn RAG: liệt kê đúng 3 mục theo thứ tự thời gian từ data truy xuất, không bịa thêm/bớt. Tương phản với T01.v1 (chưa có data → phải refuse).'
- id: T01.v2
  use_case: UC-01
  criteria:
  - TC-02
  - TC-06
  - TC-09
  name: Paraphrase tuần này
  type: realistic
  language: vi
  rerun: 3
  turns:
  - role: user
    content: tuần này có gì quan trọng không
  expected:
    eval_notes: Same intent với T01.v1 nhưng tuần này. Chạy 3x để check consistency.
- id: T01.v2.rag
  use_case: UC-01
  criteria:
  - TC-02
  - TC-06
  - TC-01
  name: '[RAG] Việc quan trọng trong tuần khi có data'
  type: rag_with_data
  language: vi
  turns:
  - role: user
    content: |-
      [Dữ liệu truy xuất — tuần 25–31/05/2026]
      - Thứ 3 (27/5): Họp HĐQT 14:00
      - Thứ 5 (29/5): Deadline báo cáo tài chính Q2
      - Thứ 6 (30/5): Ký hợp đồng đối tác Singapore

      tuần này có gì quan trọng không
  expected:
    must_contain:
    - HĐQT
    - Q2
    - Singapore
    eval_notes: 'SAU RAG: tổng hợp đúng 3 mốc quan trọng trong tuần từ data, highlight ưu tiên. Không bịa sự kiện ngoài data.'
- id: T01.v3
  use_case: UC-01
  criteria:
  - TC-02
  - TC-08
  name: Voice-to-text không dấu
  type: robustness
  language: vi
  turns:
  - role: user
    content: lich chieu nay co gi
  expected:
    eval_notes: Vẫn hiểu intent dù không dấu (voice input/mobile)
- id: T01.v3.rag
  use_case: UC-01
  criteria:
  - TC-02
  - TC-01
  name: '[RAG] Lịch chiều nay (không dấu) khi có data'
  type: rag_with_data
  language: vi
  turns:
  - role: user
    content: |-
      [Dữ liệu truy xuất — chiều 27/05/2026]
      - 13:30 Review thiết kế UI (phòng B)
      - 16:00 Call khách hàng X

      lich chieu nay co gi
  expected:
    must_contain:
    - '13:30'
    - '16:00'
    eval_notes: 'SAU RAG: hiểu input không dấu + liệt kê đúng 2 mục chiều nay từ data. Không bịa.'
- id: T01.v4
  use_case: UC-01
  criteria:
  - TC-02
  - TC-01
  name: Hallucination guard — hỏi data không có
  type: realistic
  language: vi
  turns:
  - role: user
    content: lịch họp 14h chiều nay với ai vậy
  expected:
    must_not_contain:
    - anh Nam
    - chị Lan
    - phòng họp A
    - phòng họp B
    eval_notes: 'CRITICAL: bot KHÔNG được bịa tên người/địa điểm cụ thể. Phải nói chưa có thông tin lịch họp 14h.'
- id: T01.v4.rag
  use_case: UC-01
  criteria:
  - TC-02
  - TC-01
  name: '[RAG] Họp 14h với ai — khi đã có data người tham dự'
  type: rag_with_data
  language: vi
  turns:
  - role: user
    content: |-
      [Dữ liệu truy xuất] 14:00 Họp ngân sách Q3 — thành phần: anh Nam (CFO), chị Lan (Kế toán trưởng) — phòng họp A

      lịch họp 14h chiều nay với ai vậy
  expected:
    must_contain:
    - Nam
    - Lan
    - phòng họp A
    eval_notes: 'SAU RAG: trả lời đúng thành phần + địa điểm TỪ DATA (không còn là hallucination). Tương phản T01.v4 cấm bịa khi chưa có data.'
