          - Dự án trước đó: Hoàn thành ký MOU đầu tư 10 triệu USD.
          - Trọng tâm cuộc họp hôm nay: Đàm phán triển khai thực tế giai đoạn 1 mở rộng Đông Nam Á.

          Hãy chuẩn bị brief cho cuộc họp với đối tác Singapore chiều nay.
    expected:
      must_contain: ["Keppel Corp", "MOU", "10 triệu USD"]
      eval_notes: "Tạo tóm tắt chuẩn bị họp (brief) súc tích, chuyên nghiệp dựa trên dữ liệu lịch sử đối tác."

  # ═════════════════════════════════════════════════════════════
  # XUNG ĐỘT LỊCH (UC-14) — Giả lập tương tác
  # ═════════════════════════════════════════════════════════════
  - id: T08.v1
    use_case: UC-14
    criteria: [TC-02, TC-01]
    name: "Phát hiện xung đột"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          có 2 cuộc họp này check giúp:
          - 14:00-15:00: họp Marketing phòng A
          - 14:30-15:30: họp BGĐ phòng họp lớn
    expected:
      must_contain: ["trùng", "xung đột"]
      eval_notes: "Nhận biết chính xác xung đột thời gian trong khung giờ overlap (14:30 - 15:00)."

  - id: T08.v2
    use_case: UC-14
    criteria: [TC-02, TC-01]
    name: "Không có xung đột"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          có trùng không:
          - 9:00-10:00: họp team A
          - 11:00-12:00: họp team B
    expected:
      must_not_contain: ["trùng", "xung đột", "overlap"]
      eval_notes: "Xác nhận chính xác 2 lịch họp không trùng lặp và không có bất kỳ cảnh báo sai lệch nào."

  # ═════════════════════════════════════════════════════════════
  # HỖ TRỢ ĐA NGÔN NGỮ (UC-15)
  # ═════════════════════════════════════════════════════════════
  - id: ML.v1
    use_case: UC-15
    criteria: [TC-05]
    name: "Pure English"
    type: realistic
    language: en
    turns:
      - {role: user, content: "what meetings do I have tomorrow morning"}
    expected:
      must_not_contain: ["Tôi", "Anh", "lịch họp"]
      eval_notes: "Trả lời 100% bằng tiếng Anh trôi chảy và chuyên nghiệp."

  - id: ML.v2
    use_case: UC-15
    criteria: [TC-05]
    name: "Pure Vietnamese"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "lịch họp ngày mai sao rồi"}
    expected:
      must_not_contain: ["meeting", "tomorrow", "schedule"]
      eval_notes: "Trả lời 100% bằng tiếng Việt chuẩn chỉnh, tự nhiên."

  - id: ML.v3
    use_case: UC-15
    criteria: [TC-05]
    name: "Code-switch mixed"
    type: realistic
    language: mixed
    turns:
      - {role: user, content: "send a meeting invitation cho team marketing vào 9am thứ 2"}
    expected:
      eval_notes: "Xử lý thông minh khi người dùng trộn tiếng Anh/Việt. Ưu tiên trả lời bằng tiếng Việt lịch sự."

  # ═════════════════════════════════════════════════════════════
  # HỘI THOẠI NHIỀU LƯỢT (UC-16)
  # ═════════════════════════════════════════════════════════════
  - id: T05.v1
    use_case: UC-16
    criteria: [TC-03, TC-02]
    name: "4-turn đặt lịch tích lũy info"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "đặt lịch họp với team kỹ thuật"}
      - {role: assistant, content: "Vâng, anh muốn đặt khi nào ạ?"}
      - {role: user, content: "thứ 5"}
      - {role: assistant, content: "Thứ 5 này, mấy giờ ạ?"}
      - {role: user, content: "10h sáng"}
      - {role: assistant, content: "Vâng. Họp ở đâu ạ?"}
      - {role: user, content: "phòng meeting B tầng 3"}
    expected:
      must_contain: ["team kỹ thuật", "10", "phòng"]
      must_not_contain: ["với ai", "ngày nào", "thời gian nào"]
      eval_notes: "Tổng hợp đủ toàn bộ thông tin tích lũy qua 4 lượt để xác nhận một lịch họp hoàn tất."

  - id: T05.v2
    use_case: UC-16
    criteria: [TC-03]
    name: "Đổi ý giữa chừng"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "tạo task gửi báo cáo cho Minh deadline thứ 6"}
      - {role: assistant, content: "Đã ghi. Task: gửi báo cáo / assignee: Minh / deadline: thứ 6."}
      - {role: user, content: "đổi sang thứ 2 tuần sau"}
    expected:
      must_contain: ["thứ 2", "Minh"]
      eval_notes: "Cập nhật chính xác deadline mới sang thứ 2, đồng thời giữ nguyên công việc và người được giao."

  - id: T05.v3
    use_case: UC-16
    criteria: [TC-03]
    name: "Reference vague 'cuộc họp đó'"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "đặt lịch họp với CEO 14h thứ 4"}
      - {role: assistant, content: "Đã đặt lịch họp với CEO, thứ 4, 14:00."}
      - {role: user, content: "dời cuộc họp đó sang 15h đi"}
    expected:
      must_contain: ["15"]
      must_not_contain: ["cuộc họp nào"]
      eval_notes: "Xác định đại từ chỉ định 'cuộc họp đó' chính là cuộc họp với CEO lúc 14h vừa đặt để tiến hành dời giờ."

  - id: T05.v4
    use_case: UC-16
    criteria: [TC-03, TC-08]
    name: "Push back — sếp không thích response"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "soạn email xin lỗi khách hàng vì giao hàng trễ"}
      - {role: assistant, content: "Kính gửi quý khách,\n\nChúng tôi thành thật xin lỗi vì sự chậm trễ trong việc giao hàng vừa qua. Đội ngũ của chúng tôi đã làm việc hết sức để khắc phục..."}
      - {role: user, content: "viết lại ngắn hơn"}
    expected:
      eval_notes: "Lắng nghe ý kiến của sếp và tạo phiên bản 2 tối giản, ngắn gọn hơn rõ rệt."

  - id: T05.v5
    use_case: UC-16
    criteria: [TC-03]
    name: "Chuyển ngữ cảnh đột ngột"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "lịch họp BGĐ thứ 4 có chưa"}
      - {role: assistant, content: "Tôi chưa có thông tin về lịch họp BGĐ thứ 4. Anh có thể cho biết thêm chi tiết không?"}
      - {role: user, content: "à mà email khách hàng C đâu rồi"}
    expected:
      must_not_contain: ["BGĐ", "thứ 4"]
      eval_notes: "Nhận biết việc sếp đổi chủ đề đột ngột từ họp hành sang email và tập trung trả lời câu hỏi mới."

  # ═════════════════════════════════════════════════════════════
  # BÁO CÁO CUỐI NGÀY (UC-17) — Giả lập tương tác
  # ═════════════════════════════════════════════════════════════
  - id: T09.v1
    use_case: UC-17
    criteria: [TC-02, TC-01, TC-04]
    name: "Báo cáo cuối ngày"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          tổng hợp báo cáo cuối ngày từ task list:
          - A: gửi proposal client X — DONE
          - B: review code Auth — DONE
          - C: họp Design — DONE
          - D: viết spec Payment — CHƯA, hạn ngày mai
          - E: kiểm tra báo cáo Q2 — QUÁ HẠN từ hôm qua
    expected:
      must_contain: ["hoàn thành", "quá hạn"]
      eval_notes: "Tạo cấu trúc báo cáo định dạng chuẩn: Nhóm 3 công việc hoàn thành (A, B, C), 1 công việc sắp đến hạn (D), 1 công việc quá hạn (E)."

  # ═════════════════════════════════════════════════════════════
  # KÍCH HOẠT WORKFLOW TỰ ĐỘNG (UC-18)
  # ═════════════════════════════════════════════════════════════
  - id: T11.v1
    use_case: UC-18
    criteria: [TC-02, TC-01]
    name: "Tạo task từ biên bản có cấu trúc"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          biên bản họp 19/5:
          Action items:
          1. An: thiết kế UI module Login, deadline 25/5
          2. Bình: API spec module Auth, deadline 23/5
          3. Chi: review test plan, deadline 22/5

          tạo task cho từng item và xác nhận
    expected:
      must_contain: ["An", "Bình", "Chi", "25/5", "23/5", "22/5"]
      eval_notes: "Kích hoạt chuỗi tạo 3 task riêng biệt gán đúng người và đúng thời hạn hoàn thành tương ứng."

  # ═════════════════════════════════════════════════════════════
  # Hạn chế ảo giác (Hallucination - TC-01 Critical)
  # ═════════════════════════════════════════════════════════════
  - id: HAL.v1
    use_case: UC-01
    criteria: [TC-01, TC-08]
    name: "Hỏi nội dung email cụ thể không có context"
    type: robustness
    language: vi
    turns:
      - {role: user, content: "email từ anh Tuấn sáng nay nói gì"}
    expected:
      must_not_contain: ["anh Tuấn nói", "anh Tuấn viết", "anh Tuấn báo cáo", "anh Tuấn thông báo", "theo email anh Tuấn"]
      eval_notes: "CRITICAL: Bot phải báo lỗi thiếu thông tin/không có quyền truy cập email. Tuyệt đối không được tự bịa nội dung email. Cấm chỉ các cụm KHẲNG ĐỊNH (anh Tuấn đã nói/viết/báo cáo); chấp nhận model bảo user paste nội dung."

  - id: HAL.v2
    use_case: UC-04
    criteria: [TC-01, TC-08]
    name: "Hỏi trạng thái task không có data"
    type: robustness
    language: vi
    turns:
      - {role: user, content: "Minh đã gửi báo cáo Q2 chưa"}
    expected:
      must_not_contain: ["đã gửi", "chưa gửi"]
      eval_notes: "CRITICAL: Bot không biết trạng thái thực tế do thiếu dữ liệu. Phải thông báo chưa có dữ liệu. Không tự ý khẳng định đã gửi hay chưa."

  - id: HAL.v3
    use_case: UC-08
    criteria: [TC-01, TC-08]
    name: "Tìm tài liệu không tồn tại trong context"
    type: robustness
    language: vi
    turns:
      - {role: user, content: "tìm biên bản họp tháng 3 với đối tác ABC"}
    expected:
      eval_notes: "CRITICAL: Thông báo chưa có quyền truy cập kho lưu trữ hoặc không tìm thấy tài liệu. Không bịa đặt nội dung biên bản."

  # ═════════════════════════════════════════════════════════════
  # ĐỘ DÀI & PHẢN HỒI (TC-04 Language, TC-08 Robustness)
  # ═════════════════════════════════════════════════════════════
  - id: VRB.v1
    use_case: "*"
    criteria: [TC-02, TC-08]
    name: "Chỉ định trả lời 1 câu"
    type: realistic
    language: vi
    thinking_compare: true
    turns:
      - {role: user, content: "trả lời CHỈ trong 1 câu: chiến lược tốt nhất để giảm thời gian họp là gì"}
    expected:
      eval_notes: "Phải trả lời đúng 1 câu duy nhất. Không viết thêm đoạn phân tích hay kết luận dài dòng."

  - id: VRB.v2
    use_case: "*"
    criteria: [TC-02]
    name: "Yes/No question"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "có nên dời cuộc họp 14h sang chiều mai không, biết là ngày mai tôi đang đi công tác"}
    expected:
      eval_notes: "Đưa ra khuyến nghị Có/Không (ở đây là KHÔNG nên dời sang mai vì sếp đi công tác) kèm theo lý giải cực kỳ ngắn gọn."

  # ═════════════════════════════════════════════════════════════
  # TÍNH TOÁN (TC-01 Accuracy)
  # ═════════════════════════════════════════════════════════════
  - id: MTH.v1
    use_case: UC-17
    criteria: [TC-01]
    name: "Tính tỉ lệ hoàn thành"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          tôi có 7 task: A done, B done, C pending, D done, E overdue, F done, G done. Tỉ lệ hoàn thành?
    expected:
      must_contain: ["71"]
      eval_notes: "Tính chính xác tỉ lệ hoàn thành: 5/7 = 71.4%."

  - id: MTH.v2
    use_case: UC-02
    criteria: [TC-01, TC-06]
    name: "Tính ngày"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "task này deadline 25/5 — hôm nay là 19/5 — còn bao nhiêu ngày"}
    expected:
      must_contain: ["6"]
      eval_notes: "Tính toán khoảng cách ngày chính xác: còn lại 6 ngày."

  # ═════════════════════════════════════════════════════════════
  # ĐA NHIỆM TRONG CÂU (UC-18)
  # ═════════════════════════════════════════════════════════════
  - id: MTK.v1
    use_case: UC-18
    criteria: [TC-02, TC-01]
    name: "3 việc trong 1 lệnh"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "đặt lịch họp BGĐ thứ 4 9h, soạn agenda gửi mọi người, và nhắc tôi review trước 1 ngày"}
    expected:
      must_contain: ["BGĐ", "agenda"]
      eval_notes: "Phân tách rõ và xử lý đồng thời 3 hành động: 1. Đặt lịch họp BGĐ, 2. Soạn email chương trình (agenda), 3. Tạo lịch nhắc xem lại trước 1 ngày."

  - id: MTK.v2
    use_case: UC-18
    criteria: [TC-02]
    name: "2 việc kèm điều kiện"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "nếu Minh xác nhận đến họp thì gửi anh ấy bộ tài liệu, không thì hủy lịch đi"}
    expected:
      eval_notes: "Hiểu đúng tư duy rẽ nhánh điều kiện (nếu A thì làm X, nếu không thì làm Y) và xác nhận rõ hai nhánh xử lý."

  # ═════════════════════════════════════════════════════════════
  # ROBUSTNESS bổ sung
  # ═════════════════════════════════════════════════════════════
  - id: RB.v1
    use_case: "*"
    criteria: [TC-08]
    name: "Ngoài phạm vi"
    type: edge
    language: vi
    turns:
      - {role: user, content: "đặt vé máy bay đi Tokyo tuần sau"}
    expected:
      eval_notes: "Từ chối khéo léo vì nằm ngoài phạm vi nghiệp vụ thư ký ảo hỗ trợ quản lý lịch/công việc nội bộ."

  - id: RB.v2
    use_case: "*"
    criteria: [TC-08]
    name: "Mâu thuẫn trong câu"
    type: edge
    language: vi
    turns:
      - {role: user, content: "đặt lịch họp thứ 2 ngày 25/5 lúc 9h. à không, 26/5."}
    expected:
      must_contain: ["26"]
      eval_notes: "Ưu tiên xử lý theo dữ liệu hiệu đính mới nhất ở cuối câu (ngày 26/5)."

  - id: RB.v3
    use_case: "*"
    criteria: [TC-08]
    name: "Câu rất cụt"
    type: edge
    language: vi
    turns:
      - {role: user, content: "huỷ"}
    expected:
      eval_notes: "Phải hỏi rõ đối tượng muốn hủy là gì (hủy lịch họp, hủy task hay hủy soạn thư)."

  - id: RB.v4
    use_case: "*"
    criteria: [TC-08, TC-02]
    name: "Sai chính tả nặng + viết tắt"
    type: edge
    language: vi
    turns:
      - {role: user, content: "nhc t hop vs CEO 2h c.nay nha"}
    expected:
      eval_notes: "Dịch nghĩa chuẩn xác ngôn ngữ viết tắt/sai chính tả ('nhắc tôi họp với CEO lúc 2h chiều nay nhé') và xác nhận hành động tương ứng."

  # ═════════════════════════════════════════════════════════════
  # TC-06 TEMPORAL REASONING — bổ sung (lấp gap TC-06 yếu nhất)
  # ═════════════════════════════════════════════════════════════
  - id: TMP.v1
    use_case: UC-01
    criteria: [TC-06, TC-02]
    name: "Đầu tháng sau"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "lịch đầu tháng sau có gì"}
    expected:
      eval_notes: "Hiểu 'đầu tháng sau' = khoảng 1-7 của tháng kế. Vì không có data → phải nói chưa có quyền truy cập, KHÔNG bịa lịch."

  - id: TMP.v2
    use_case: UC-02
    criteria: [TC-06, TC-01]
    name: "Số ngày đã trôi qua"
    type: reasoning_with_data
    language: vi
    turns:
      - {role: user, content: "task A bắt đầu 10/5/2026, deadline 24/5/2026, hôm nay là 19/5/2026 — đã chạy bao nhiêu ngày"}
    expected:
      must_contain: ["9"]
      eval_notes: "10/5/2026 → 19/5/2026 = 9 ngày đã trôi qua. Đầy đủ context, không cần hỏi lại năm."

  - id: TMP.v3
    use_case: UC-02
    criteria: [TC-06]
    name: "Cuối tháng này là ngày bao nhiêu"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "deadline cuối tháng này rơi vào ngày bao nhiêu, hôm nay 21/5"}
    expected:
      must_contain: ["31"]
      eval_notes: "Tháng 5 có 31 ngày → cuối tháng = 31/5."

  - id: TMP.v4
    use_case: UC-08
    criteria: [TC-06, TC-08]
    name: "Refusal khi hỏi data tuần trước"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "biên bản họp thứ 4 tuần trước với team dev nói gì"}
    expected:
      must_not_contain: ["team dev nói", "team dev đã quyết"]
      eval_notes: "Hiểu 'thứ 4 tuần trước'. Vì không có data biên bản → refusal hợp lệ, KHÔNG bịa nội dung."

  - id: TMP.v5
    use_case: UC-04
    criteria: [TC-06, TC-02]
    name: "Nhắc sau N tiếng nữa"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "bây giờ 9h sáng, nhắc tôi gọi anh Long sau 3 tiếng nữa"}
    expected:
      must_contain: ["Long", "12"]
      eval_notes: "9h + 3h = 12h trưa. Xác nhận task nhắc gọi anh Long lúc 12h."

  - id: TMP.v6
    use_case: UC-02
    criteria: [TC-06, TC-01]
    name: "Số tuần còn lại trong quý"
    type: reasoning_with_data
    language: vi
    turns:
      - {role: user, content: "Q2 kết thúc 30/6/2026. Hôm nay 21/5/2026. Tính theo lịch dương, còn bao nhiêu tuần đến hết Q2?"}
    expected:
      eval_notes: "Từ 21/5 đến 30/6 = 40 ngày ≈ 5-6 tuần dương lịch (chấp nhận 5, 5.5, 5-6, hoặc 6). Không cần lịch làm việc."

  # ═════════════════════════════════════════════════════════════
  # TC-09 CONSISTENCY — rerun để check biến động giữa các lần
  # ═════════════════════════════════════════════════════════════
  - id: CST.v1
    use_case: UC-04
    criteria: [TC-09, TC-02, TC-08]
    name: "Refusal nhất quán khi thiếu data"
    type: realistic
    language: vi
    rerun: 3
    turns:
      - {role: user, content: "tình hình dự án Alpha thế nào rồi"}
    expected:
      eval_notes: "3 lần chạy đều phải refusal hợp lệ (chưa có data dự án Alpha), không lần nào bịa tiến độ."

  - id: CST.v2
    use_case: UC-09
    criteria: [TC-09, TC-04]
    name: "Email format nhất quán qua nhiều lần"
    type: realistic
    language: vi
    rerun: 3
    turns:
      - {role: user, content: "soạn email cảm ơn đối tác sau cuộc họp hôm nay"}
    expected:
      eval_notes: "3 phiên bản email có thể khác nhau về chữ nhưng đều giữ format chuẩn (kính gửi/lời cảm ơn/kết). Không lần nào lệch format hay đổi ngôn ngữ."

  - id: CST.v3
    use_case: UC-02
    criteria: [TC-09, TC-01, TC-06]
    name: "Phép toán ngày nhất quán"
    type: realistic
    language: vi
    rerun: 3
    turns:
      - {role: user, content: "deadline 25/5/2026, hôm nay 19/5/2026, còn bao nhiêu ngày"}
    expected:
      must_contain: ["6"]
      eval_notes: "Cả 3 lần đều phải ra 6 ngày — accuracy + consistency. Đầy đủ context, không cần hỏi năm."

  # ═════════════════════════════════════════════════════════════
  # TC-05 LANGUAGE — chống chèn ngôn ngữ lạ + EN drift
  # ═════════════════════════════════════════════════════════════
  - id: LNG.v1
    use_case: UC-02
    criteria: [TC-05, TC-04]
    name: "Reply VN — không chèn CJK"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "task nào đang sắp đến hạn trong 3 ngày tới"}
    expected:
      must_not_contain: ["的", "了", "是", "は", "です", "の", "を", "中文"]
      eval_notes: "Response thuần Việt, không lẫn ký tự Trung/Nhật ngoài bảng chữ tiếng Việt."

  - id: LNG.v2
    use_case: UC-09
    criteria: [TC-05]
    name: "EN reply — không kính ngữ Việt"
    type: realistic
    language: en
    turns:
      - {role: user, content: "summarize my pending tasks for this week"}
    expected:
      must_not_contain: ["Dạ", "Kính gửi", "Trân trọng", "thưa sếp", "Báo cáo sếp", "ạ."]
      eval_notes: "Phản hồi 100% tiếng Anh, không kính ngữ tiếng Việt."

  - id: LNG.v3
    use_case: UC-09
    criteria: [TC-05, TC-02]
    name: "EN dài — không drift sang VN"
    type: realistic
    language: en
    turns:
      - role: user
        content: |
          draft a 5-bullet weekly status update for my CEO covering:
          1) sales pipeline
          2) hiring
          3) product launch
          4) customer escalations
          5) board prep
    expected:
      must_not_contain: ["Dạ", "Kính gửi", "Trân trọng", "ạ.", "thưa"]
      eval_notes: "Email dài, không được drift sang tiếng Việt ở bất kỳ bullet nào."

  # ═════════════════════════════════════════════════════════════
  # TC-04 LANGUAGE QUALITY — tone phù hợp người nhận
  # ═════════════════════════════════════════════════════════════
  - id: TON.v1
    use_case: UC-09
    criteria: [TC-04, TC-02]
    name: "Nhắn cấp dưới — informal"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "nhắn em Linh phòng kế toán nộp bảng lương tháng trước trước cuối ngày mai"}
    expected:
      must_contain: ["Linh"]
      must_not_contain: ["Kính gửi", "Trân trọng quý"]
      eval_notes: "Tin nhắn ngắn gửi cấp dưới — văn phong informal, không dùng kính ngữ trang trọng quá mức."

  - id: TON.v2
    use_case: UC-09
    criteria: [TC-04, TC-01]
    name: "Email gửi cấp trên — trang trọng"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "soạn email gửi Chủ tịch HĐQT báo cáo kết quả công tác tháng 5"}
    expected:
      must_contain: ["Kính gửi"]
      eval_notes: "Email gửi Chủ tịch → văn phong trang trọng, đầy đủ cấu trúc (Kính gửi/Nội dung/Trân trọng)."

  # ═════════════════════════════════════════════════════════════
  # TC-01 ACCURACY — math + trích số liệu chính xác
  # ═════════════════════════════════════════════════════════════
  - id: ACC.v1
    use_case: UC-17
    criteria: [TC-01]
    name: "Tỉ lệ phần trăm khác"
    type: reasoning_with_data
    language: vi
    turns:
      - {role: user, content: "team có 12 người, 9 hoàn thành KPI tháng. Tỉ lệ hoàn thành?"}
    expected:
      must_contain: ["75"]
      eval_notes: "9/12 = 75% — phải ra đúng con số 75."

  - id: ACC.v2
    use_case: UC-08
    criteria: [TC-01, TC-02]
    name: "Trích số từ đoạn báo cáo dài"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          Báo cáo Q1: doanh thu 12.5 tỷ (tăng 18% YoY), chi phí 9.2 tỷ, lợi nhuận trước thuế 3.3 tỷ. Khách hàng mới: 145.

          Cho tôi biết lợi nhuận trước thuế Q1.
    expected:
      must_contain: ["3.3"]
      must_not_contain: ["12.5 tỷ lợi nhuận", "9.2 tỷ lợi nhuận"]
      eval_notes: "Trích đúng số lợi nhuận trước thuế 3.3 tỷ, không nhầm với doanh thu/chi phí."

  # ═════════════════════════════════════════════════════════════
  # TC-02 INTENT — multi-intent + intent mơ hồ
  # ═════════════════════════════════════════════════════════════
  - id: INT.v1
    use_case: "*"
    criteria: [TC-02, TC-01]
    name: "2 intent trái nhau trong 1 câu"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "hủy lịch họp 3h chiều nay và thay vào đó nhắc tôi gọi cho Hùng"}
    expected:
      must_contain: ["Hùng"]
      eval_notes: "Nhận diện 2 intent (cancel meeting + create reminder), xác nhận xử lý cả 2 hành động."

  - id: INT.v2
    use_case: "*"
    criteria: [TC-02, TC-08]
    name: "Intent mơ hồ — chỉ định không rõ"
    type: edge
    language: vi
    turns:
      - {role: user, content: "thế còn cái kia"}
    expected:
      eval_notes: "Câu mơ hồ, không có context trước → phải hỏi lại 'cái kia' đề cập tới việc gì."
