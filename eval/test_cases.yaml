# ===============================================================
# Test Cases — Chatbot Thư Ký (Cập nhật nhất quán với v3 Spec)
# ===============================================================
# Phân loại test:
#   (A) Realistic UC — sếp query tự nhiên, không inject data
#   (B) Reasoning-with-data — inject data trong prompt để test khả năng suy luận
#   (C) Robustness — edge case, no-diacritics, push back, mâu thuẫn
#
# Tiêu chí đánh giá chuẩn (TC-xx):
#   TC-01: Accuracy (Độ chính xác thông tin)
#   TC-02: Intent Recognition (Nhận diện ý định)
#   TC-03: Multi-turn Context Retention (Duy trì ngữ cảnh)
#   TC-04: Language Quality (Văn phong & Ngữ pháp)
#   TC-05: Multilingual Support (Hỗ trợ đa ngôn ngữ)
#   TC-06: Temporal Reasoning (Lý luận thời gian)
#   TC-08: Robustness (Xử lý ngoại lệ)
#   TC-09: Consistency (Nhất quán)
# ===============================================================

system_prompt: |
  Bạn là thư ký AI cho lãnh đạo: quản lý lịch, công việc, email, hỗ trợ ra quyết định.
  Trả lời ngắn gọn, chuyên nghiệp; cùng ngôn ngữ với user (user English → reply English; mặc định tiếng Việt).
  Đã đủ dữ liệu → xử lý/xác nhận ngay, KHÔNG hỏi lại thông tin đã có. Thiếu data → nói rõ và hỏi cụ thể.
  KHÔNG bịa lịch/email/task/tên người.

test_cases:

  # ═════════════════════════════════════════════════════════════
  # NHẮC LỊCH (UC-01) — realistic queries
  # ═════════════════════════════════════════════════════════════
  - id: T01.v1
    use_case: UC-01
    criteria: [TC-02, TC-06, TC-08]
    name: "Sếp gõ cụt: 'lịch hôm nay'"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "lịch hôm nay"}
    expected:
      eval_notes: "Hiểu intent dù query cụt. Vì không có data → phải nói chưa có quyền truy cập calendar, KHÔNG bịa lịch."

  - id: T01.v2
    use_case: UC-01
    criteria: [TC-02, TC-06, TC-09]
    name: "Paraphrase tuần này"
    type: realistic
    language: vi
    rerun: 3
    turns:
      - {role: user, content: "tuần này có gì quan trọng không"}
    expected:
      eval_notes: "Same intent với T01.v1 nhưng tuần này. Chạy 3x để check consistency."

  - id: T01.v3
    use_case: UC-01
    criteria: [TC-02, TC-08]
    name: "Voice-to-text không dấu"
    type: robustness
    language: vi
    turns:
      - {role: user, content: "lich chieu nay co gi"}
    expected:
      eval_notes: "Vẫn hiểu intent dù không dấu (voice input/mobile)"

  - id: T01.v4
    use_case: UC-01
    criteria: [TC-02, TC-01]
    name: "Hallucination guard — hỏi data không có"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "lịch họp 14h chiều nay với ai vậy"}
    expected:
      must_not_contain: ["anh Nam", "chị Lan", "phòng họp A", "phòng họp B"]
      eval_notes: "CRITICAL: bot KHÔNG được bịa tên người/địa điểm cụ thể. Phải nói chưa có thông tin lịch họp 14h."

  # ═════════════════════════════════════════════════════════════
  # DEADLINE (UC-02)
  # ═════════════════════════════════════════════════════════════
