          ai chưa phản hồi
    expected:
      must_contain: ["Bình", "Chi"]
      must_not_contain: ["An chưa", "Dũng chưa"]
      eval_notes: "Phân tích chính xác trạng thái: Bình (hứa nhưng chưa gửi) và Chi (hoàn toàn im lặng) là những người chưa phản hồi kết quả."

  # ═════════════════════════════════════════════════════════════
  # ACTION ITEMS TỪ TRANSCRIPT (UC-12)
  # ═════════════════════════════════════════════════════════════
  - id: T13.v1
    use_case: UC-12
    criteria: [TC-02, TC-01]
    name: "Action items từ transcript hội thoại tự nhiên"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          trích action items từ transcript họp này:

          An: ok vậy về module login, tôi sẽ làm wireframe xong trước thứ 5
          Bình: tôi cần wireframe đó để viết API, vậy thứ 6 tôi gửi spec được không
          An: ok thứ 6 fine
          Chi: còn phần test thì sao
          Bình: Chi review test plan luôn nhé, giúp tôi check coverage
          Chi: ok tôi review trong tuần này
          An: à và mọi người nhớ update progress trên Jira mỗi thứ 3 hàng tuần
          Bình: ok deal
          Chi: ok
    expected:
      must_contain: ["An", "Bình", "Chi"]
      eval_notes: "Trích xuất đầy đủ 4 action items: An (wireframe login - trước thứ 5), Bình (API spec - thứ 6), Chi (review test plan - trong tuần), Tất cả (update progress Jira - thứ 3 hàng tuần)."

  - id: T13.v2
    use_case: UC-12
    criteria: [TC-01, TC-08]
    name: "Transcript không có action item rõ"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          trích action items công việc (chỉ task liên quan công việc, bỏ qua hội thoại xã giao):

          A: nay thời tiết đẹp ha
          B: ừ mai rảnh đi cà phê Highland chơi
          A: ok nha
    expected:
      eval_notes: "Hội thoại xã giao thuần tuý (rủ đi cà phê), KHÔNG có action item công việc. Bot phải trả lời 'không có action item công việc nào'."

