    expected:
      eval_notes: "Yêu cầu người dùng cung cấp nội dung email cần tóm tắt."

  # ═════════════════════════════════════════════════════════════
  # TÌM KIẾM & TRUY XUẤT THÔNG TIN (UC-08) - [UPDATED WITH DATA]
  # ═════════════════════════════════════════════════════════════
  - id: T17.v1
    use_case: UC-08
    criteria: [TC-01, TC-02]
    name: "Tìm thông tin cụ thể trong tài liệu cung cấp"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          Dưới đây là Biên bản họp tháng 3 với đối tác ABC:
          "Thời gian: 15/03/2026. Nội dung thảo luận: Đối tác ABC đồng ý ký MOU vào ngày 22/03/2026. Đại diện ABC tham dự gồm ông Tan và bà Lee."

          Tìm giúp tôi biên bản họp tháng 3 với ABC nói về ngày ký MOU là ngày nào?
    expected:
      must_contain: ["22/03/2026", "MOU"]
      eval_notes: "Truy xuất chính xác ngày ký MOU là 22/03/2026 từ biên bản được cung cấp."

