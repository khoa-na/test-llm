    expected:
      must_contain: ["Biên bản", "Beta", "25/5", "28/5"]
      eval_notes: "Tạo tài liệu biên bản họp có cấu trúc chuẩn chỉnh, trình bày mạch lạc, giữ nguyên thông tin gốc."

  # ═════════════════════════════════════════════════════════════
  # THEO DÕI PHẢN HỒI (UC-11) — Giả lập tương tác
  # ═════════════════════════════════════════════════════════════
  - id: T10.v1
    use_case: UC-11
    criteria: [TC-02, TC-01]
    name: "Tìm người chưa phản hồi"
    type: reasoning_with_data
    language: vi
    turns:
      - role: user
        content: |
          tuần trước gửi yêu cầu báo cáo Q2 cho 4 người:
          - An: đã gửi báo cáo 2 ngày trước
          - Bình: đã xác nhận sẽ gửi nhưng chưa thấy
          - Chi: chưa phản hồi gì
