    use_case: UC-02
    criteria: [TC-02, TC-06]
    name: "Việc gì gấp tuần này"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "việc gì gấp tuần này"}
    expected:
      eval_notes: "Intent: list deadline tuần này. Không data → phải nói chưa có context."

  - id: T02.v2
    use_case: UC-02
    criteria: [TC-02]
    name: "Task quá hạn"
    type: realistic
    language: vi
    turns:
      - {role: user, content: "task nào đang trễ"}
    expected:
      eval_notes: "Phân biệt quá hạn vs sắp tới hạn"

  # ═════════════════════════════════════════════════════════════
  # ĐẶT LỊCH (UC-03)
  # ═════════════════════════════════════════════════════════════
  - id: T03.v1
    use_case: UC-03
    criteria: [TC-02, TC-06, TC-01]
    name: "Đặt lịch đầy đủ info"
    type: realistic
    language: vi
    turns:
