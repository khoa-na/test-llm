name: tests

on:
  push:
    branches: [main, modal]
  pull_request:

jobs:
  retrieval-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps (CPU-only, no GPU/model)
        run: pip install numpy
      - name: Run retrieval unit tests
        run: python test_retrieval.py
